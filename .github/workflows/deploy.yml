name: CI/CD Pipeline & Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: AI Service Tests (FastAPI + Gemini + LangGraph + Qdrant)
  # ----------------------------------------------------------------------------
  test-ai-service:
    name: Test AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Validate Python Syntax and Imports
        run: |
          python -m compileall app/
          python -c "from app.main import app; print('App routes initialized successfully')"

      - name: Run AI Service Tests
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          res = client.get('/health')
          assert res.status_code == 200, f'Health failed: {res.status_code}'
          root = client.get('/')
          assert root.status_code == 200, f'Root failed: {root.status_code}'
          print('Health and Root endpoints verified')
          "

  # ----------------------------------------------------------------------------
  # Job 2: Node Services Tests (API & Next.js Web)
  # ----------------------------------------------------------------------------
  test-node-services:
    name: Test Node & Next.js Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      # Verify Express API
      - name: Install API Dependencies
        working-directory: apps/api
        run: npm ci

      - name: Typecheck API Service
        working-directory: apps/api
        run: npx tsc --noEmit

      # Verify Next.js Web Frontend
      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck Web Service
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Next.js Web Bundle
        working-directory: apps/web
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Build Docker Image for AI Service
  # ----------------------------------------------------------------------------
  build-ai-docker:
    name: Build AI Service Container
    needs: [test-ai-service, test-node-services]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/ai-service
          file: apps/ai-service/Dockerfile
          push: false
          tags: codescry-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 4: Deploy (Placeholder Stub)
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: [build-ai-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment
        run: |
          echo "======================================================================"
          echo "CodeScry AI Autonomous PR Review Pipeline - Deployment Step"
          echo "======================================================================"
          # TODO: push to registry / deploy to <target>
          # Example Cloud Run / ECS / Kubernetes deployment:
          # echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          # docker tag codescry-ai-service:latest myregistry.azurecr.io/codescry-ai-service:${{ github.sha }}
          # docker push myregistry.azurecr.io/codescry-ai-service:${{ github.sha }}
          # gcloud run deploy codescry-ai --image gcr.io/my-project/codescry-ai-service:${{ github.sha }} --region us-central1
          echo "CI/CD checks and Docker build succeeded. Ready for production rollout."
